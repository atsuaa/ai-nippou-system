components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: メールアドレス
          example: sato@example.com
        password:
          type: string
          minLength: 1
          description: パスワード
      required:
        - email
        - password
    StaffMutationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: 氏名
          example: 佐藤 太郎
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: メールアドレス(一意)
          example: sato@example.com
        role:
          $ref: "#/components/schemas/StaffRole"
        managerId:
          description: "上長のstaffId。roleが「上長」の担当者を指定する(検討事項: 権限設計の詳細はrequirements.md 4章参照)"
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      required:
        - name
        - email
        - role
    CustomerMutationRequest:
      type: object
      properties:
        customerName:
          type: string
          minLength: 1
          description: 顧客名
          example: 株式会社サンプル
        industry:
          description: 業種
          type: string
        address:
          description: 住所
          type: string
        phone:
          description: 電話番号
          type: string
        primaryStaffId:
          description: 主担当営業のstaffId
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
      required:
        - customerName
    ReportMutationRequest:
      type: object
      properties:
        reportDate:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
          description: 報告日
          example: 2026-08-14
        problem:
          description: 課題・相談(FR-06)
          type: string
        plan:
          description: 明日やること(FR-07)
          type: string
        visits:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/VisitRecordInput"
          description: 訪問記録の配列(FR-02)
      required:
        - reportDate
        - visits
    VisitRecordInput:
      type: object
      properties:
        customerId:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
          description: 訪問した顧客のcustomerId(顧客マスタから選択)
        visitTime:
          description: 訪問時刻・順序
          example: 10:00
          type: string
          minLength: 1
        visitContent:
          type: string
          minLength: 1
          description: 訪問内容
      required:
        - customerId
        - visitContent
    CommentMutationRequest:
      type: object
      properties:
        commentContent:
          type: string
          minLength: 1
          description: コメント内容
          example: 値引きは15%まで許容可能。明日相談しよう。
      required:
        - commentContent
    StaffRole:
      type: string
      enum:
        - 営業担当者
        - 上長
        - 管理者
      description: 営業担当者の役割
      example: 営業担当者
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: アクセストークン(JWT想定)
        staff:
          type: object
          properties:
            staffId:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            name:
              type: string
            role:
              $ref: "#/components/schemas/StaffRole"
          required:
            - staffId
            - name
            - role
          additionalProperties: false
      required:
        - accessToken
        - staff
      additionalProperties: false
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ApiErrorCode"
            message:
              type: string
              description: エラーメッセージ
            details:
              description: バリデーションエラー等の詳細
              type: array
              items:
                $ref: "#/components/schemas/ApiErrorDetail"
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    ApiErrorCode:
      type: string
      enum:
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - VALIDATION_ERROR
        - DUPLICATE_REPORT
        - DUPLICATE_EMAIL
        - INTERNAL_ERROR
      description: APIエラーコード(docs/api.md 6章)
    ApiErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: エラーが発生したフィールド名
        message:
          type: string
          description: フィールドごとのエラー内容
      required:
        - field
        - message
      additionalProperties: false
    Staff:
      type: object
      properties:
        staffId:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        name:
          type: string
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        role:
          $ref: "#/components/schemas/StaffRole"
        managerId:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        managerName:
          type:
            - string
            - "null"
      required:
        - staffId
        - name
        - email
        - role
      additionalProperties: false
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: ページ番号
        perPage:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: 1ページあたりの件数
        totalCount:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: 総件数
      required:
        - page
